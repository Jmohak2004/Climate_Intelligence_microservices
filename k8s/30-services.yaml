apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: suryarakshak
  labels: { app: weather-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: weather-service }
  template:
    metadata:
      labels: { app: weather-service }
    spec:
      containers:
        - name: weather-service
          image: suryarakshak/weather-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3001" }
          envFrom:
            - configMapRef: { name: suryarakshak-config }
          ports:
            - containerPort: 3001
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
  namespace: suryarakshak
spec:
  selector: { app: weather-service }
  ports:
    - port: 3001
      targetPort: 3001
---

# Edge gateway: serves the React build and routes /api/* to the owning microservice.
# Service hostnames resolve through Docker Compose DNS and Kubernetes Service DNS alike.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/                 { proxy_pass http://auth-service:3005; }
  location ~ ^/api/(dashboard|regions|forecast|analytics|exposure|health$) { proxy_pass http://weather-service:3001; }
  location /api/alerts                { proxy_pass http://alert-service:3002; }
  location ~ ^/api/(health-advisories|resources) { proxy_pass http://advisory-service:3003; }
  location /api/aws/                  { proxy_pass http://aws-service:3004; }

  location / {
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
